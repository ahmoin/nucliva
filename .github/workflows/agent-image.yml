name: Agent image

# Builds the container each Nebius Serverless agent job runs, and publishes it
# to GitHub's container registry as ghcr.io/<owner>/nucliva-agent:latest.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-image.yml
      - agent.Dockerfile
      - apps/web/lib/**
      - apps/web/scripts/agent-run.mts
      - packages/db/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nucliva-agent:latest
